  src/controllers/easyWalletController.js,\
  src/routes/easyWallet.routes.js,\
  src/middleware/auth.middleware.js,\
  src/utils/apiResponse.js
sonar.exclusions=\
  src/**/__tests__/**,\
  src/**/*.test.js,\
  src/**/*.spec.js,\
  src/api/**,\
  src/services/gpt/**,\
  src/config/**,\
  src/scripts/**
sonar.host.url=http://localhost:9000
sonar.token=squ_11af45207ea00436eae321d4dc9fd222f3246569
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
  src/**/__tests__/**,\
  src/**/*.test.js,\
  src/**/*.spec.js

