# Backend-only Sonar scan
# SONAR_TOKEN and SONAR_HOST_URL are injected by CI — never commit secrets.

sonar.projectKey=smartproperty-backend-reviews-easywallet
sonar.projectName=SmartProperty Backend - Reviews & EasyWallet Module

# ── Source roots ──────────────────────────────────────────────────────────────
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=\
  **/__tests__/**,\
  **/*.test.js,\
  **/*.spec.js

sonar.inclusions=\
  src/controllers/feedbackController.js,\
  src/routes/feedback.routes.js,\
  src/services/reviewProfanity.service.js,\
  src/controllers/easyWalletController.js,\
  src/routes/easyWallet.routes.js,\
  src/middleware/auth.middleware.js,\
  src/utils/apiResponse.js

sonar.exclusions=\
  src/**/__tests__/**,\
  src/**/*.test.js,\
  src/**/*.spec.js,\
  src/api/**,\
  src/services/gpt/**,\
  src/config/**,\
  src/scripts/**

# ── Coverage ──────────────────────────────────────────────────────────────────
# Path is relative to the directory where sonar-scanner is invoked (backend/)
sonar.javascript.lcov.reportPaths=coverage/lcov.info

sonar.coverage.exclusions=\
  src/**/__tests__/**,\
  src/**/*.test.js,\
  src/**/*.spec.js,\
  src/routes/**,\
  src/config/**,\
  src/scripts/**

sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true