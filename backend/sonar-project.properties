# Backend-only Sonar scan (run sonar-scanner from this directory).
# Use SONAR_TOKEN and SONAR_HOST_URL from CI (do not commit secrets).

sonar.projectKey=smartproperty-backend-reviews-easywallet
sonar.projectName=SmartProperty Backend - Reviews & EasyWallet Module
sonar.sources=src
sonar.inclusions=\
  src/controllers/feedbackController.js,\
  src/routes/feedback.routes.js,\
  src/services/reviewProfanity.service.js,\
  src/controllers/easyWalletController.js,\
  src/routes/easyWallet.routes.js,\
  src/middleware/auth.middleware.js,\
  src/utils/apiResponse.js
sonar.exclusions=\
  src/**/__tests__/**,\
  src/**/*.test.js,\
  src/**/*.spec.js,\
  src/api/**,\
  src/services/gpt/**,\
  src/config/**,\
  src/scripts/**
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=\
  src/**/__tests__/**,\
  src/**/*.test.js,\
  src/**/*.spec.js
