# Backend-only Sonar scan
# SONAR_TOKEN and SONAR_HOST_URL are injected by CI — never commit secrets.

sonar.projectKey=smartproperty-backend-reviews-easywallet
sonar.projectName=SmartProperty Backend

# ── Source roots ──────────────────────────────────────────────────────────────
sonar.sources=src
sonar.tests=src
sonar.test.inclusions=\
  **/__tests__/**,\
  **/*.test.js,\
  **/*.spec.js

sonar.exclusions=\
  src/**/__tests__/**,\
  src/**/*.test.js,\
  src/**/*.spec.js,\
  src/api/**,\
  src/services/gpt/**,\
  src/config/**,\
  src/scripts/**

# ── Coverage ──────────────────────────────────────────────────────────────────
# Path is relative to the directory where sonar-scanner is invoked (backend/)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-report.xml

sonar.coverage.exclusions=\
  src/**/__tests__/**,\
  src/**/*.test.js,\
  src/**/*.spec.js,\
  src/config/**,\
  src/scripts/**

sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true