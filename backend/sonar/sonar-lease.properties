# Sonar scan for Lease controller tests only
sonar.projectKey=smartproperty-backend-lease
sonar.projectName=SmartProperty Backend - Lease

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/controllers/__tests__/leaseController.test.js
sonar.inclusions=src/controllers/leaseController.js,src/routes/lease.routes.js

sonar.exclusions=src/**/__tests__/**,src/**/*.test.js,src/**/*.spec.js,src/api/**,src/services/gpt/**,src/config/**,src/scripts/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-report.xml

sonar.coverage.exclusions=src/**/__tests__/**,src/**/*.test.js,src/**/*.spec.js,src/config/**,src/scripts/**

sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true
