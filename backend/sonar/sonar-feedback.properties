# Sonar scan for Feedback controller tests only
sonar.projectKey=smartproperty-backend-feedback
sonar.projectName=SmartProperty Backend - Feedback

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/controllers/__tests__/feedbackController.test.js
sonar.inclusions=src/controllers/feedbackController.js,src/routes/feedback.routes.js,src/services/reviewProfanity.service.js

sonar.exclusions=src/**/__tests__/**,src/**/*.test.js,src/**/*.spec.js,src/api/**,src/services/gpt/**,src/config/**,src/scripts/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-report.xml

sonar.coverage.exclusions=src/**/__tests__/**,src/**/*.test.js,src/**/*.spec.js,src/config/**,src/scripts/**

sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true
