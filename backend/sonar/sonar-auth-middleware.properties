# Sonar scan for Auth middleware tests only
sonar.projectKey=smartproperty-backend-auth-middleware
sonar.projectName=SmartProperty Backend - Auth Middleware

sonar.sources=src
sonar.tests=src
sonar.test.inclusions=src/controllers/__tests__/auth.middleware.test.js
sonar.inclusions=src/middleware/auth.middleware.js

sonar.exclusions=src/**/__tests__/**,src/**/*.test.js,src/**/*.spec.js,src/api/**,src/services/gpt/**,src/config/**,src/scripts/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.testExecutionReportPaths=coverage/test-report.xml

sonar.coverage.exclusions=src/**/__tests__/**,src/**/*.test.js,src/**/*.spec.js,src/config/**,src/scripts/**

sonar.sourceEncoding=UTF-8
sonar.scm.disabled=true
