sonar.projectKey=smart-property-root
sonar.projectName=Smart Property - Full Platform
sonar.projectVersion=1.0
sonar.sourceEncoding=UTF-8

# Modules definition
sonar.modules=backend,frontend,backofficee

# Common exclusions
sonar.exclusions=**/node_modules/**,**/dist/**,**/build/**,**/coverage/**,**/tests/**,**/*.test.js,**/*.spec.js

# Backend Module Configuration
backend.sonar.projectName=SmartProperty - Backend
backend.sonar.sources=src
backend.sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Frontend Module Configuration
frontend.sonar.projectName=SmartProperty - Frontend
frontend.sonar.sources=src
frontend.sonar.inclusions=src/**/*.js,src/**/*.jsx,src/**/*.ts,src/**/*.tsx

# Backoffice Module Configuration
backofficee.sonar.projectName=SmartProperty - Backoffice
backofficee.sonar.sources=src
backofficee.sonar.inclusions=src/**/*.js,src/**/*.jsx,src/**/*.ts,src/**/*.tsx
